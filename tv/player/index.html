<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyTV 播放器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <h1>MyTV</h1>
          <p id="catalogStatus">正在加载频道...</p>
        </div>
      </div>
      <div class="actions">
        <a class="apk-link" href="../mytv.apk">下载APK</a>
        <button id="refreshButton" type="button">刷新</button>
      </div>
    </header>

    <section class="layout" aria-label="MyTV 网页播放器">
      <aside class="regions" aria-label="地区">
        <div class="panel-title">地区</div>
        <div id="regionList" class="region-list"></div>
      </aside>

      <aside class="channels" aria-label="频道">
        <div class="panel-title">频道</div>
        <input id="searchInput" class="search" type="search" placeholder="搜索频道" autocomplete="off">
        <div id="channelList" class="channel-list"></div>
      </aside>

      <section class="player-panel">
        <div class="video-frame">
          <video id="video" controls playsinline></video>
          <div id="idleOverlay" class="idle-overlay">
            <span class="live-pill">直播</span>
            <strong>MyTV</strong>
            <span>请选择一个频道开始播放</span>
          </div>
        </div>

        <footer class="now-bar">
          <div class="now-section">
            <span class="label">正在播放</span>
            <strong id="nowTitle">请选择频道</strong>
            <span id="nowMeta">网页播放器</span>
          </div>
          <div class="now-section next">
            <span class="label">信号源</span>
            <strong id="sourceStatus">就绪</strong>
            <a id="streamLink" href="#" target="_blank" rel="noreferrer">打开原始流</a>
          </div>
          <div class="signal">
            <span>直播流</span>
            <strong id="signalText">在线</strong>
          </div>
        </footer>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
